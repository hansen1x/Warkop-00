<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.jpeg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasir Warkop">
<title>Kasir & Stok Warkop</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6efe6;--cd:#fffdf9;--tx:#2b2018;--mu:#8a7a6a;--ac:#c4541a;--ac2:#e8893f;--ln:#eadfce;--ok:#2e7d4f;--bad:#c0392b;--sh:0 2px 10px rgba(80,50,20,.08);--ib:#f1e8da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--cd:#241d17;--tx:#f3ebe0;--mu:#a69685;--ac:#e8813f;--ac2:#f2a366;--ln:#372e25;--ok:#5ec58a;--bad:#ef7a6b;--sh:0 2px 10px rgba(0,0,0,.35);--ib:#1b1511}}
:root[data-theme="dark"]{--bg:#17120e;--cd:#241d17;--tx:#f3ebe0;--mu:#a69685;--ac:#e8813f;--ac2:#f2a366;--ln:#372e25;--ok:#5ec58a;--bad:#ef7a6b;--sh:0 2px 10px rgba(0,0,0,.35);--ib:#1b1511}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 110px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.hd h1{margin:0;font-size:20px}.hd small{opacity:.85;font-size:12px}
.hd .t{text-align:right}.hd .t b{display:block;font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;background:var(--cd);border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 2px;border-radius:12px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--ac);background:var(--ib);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.it{position:relative;text-align:left;padding:14px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:16px;font:inherit;display:flex;flex-direction:column;gap:3px;min-height:92px;box-shadow:var(--sh);transition:transform .08s}
.it:active{transform:scale(.96)}
.it b{font-size:15px;padding-right:26px}.it span{color:var(--ac);font-weight:700;font-size:17px}.it small{color:var(--mu)}
.bd{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:99px;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:14px 0;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.bad{color:var(--bad)!important}.ok{color:var(--ok)}
.big{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;font-size:16px;margin-top:10px;box-shadow:var(--sh)}
.big:active{opacity:.85}
.sm{padding:8px 12px;border:1px solid var(--ln);background:var(--ib);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
input,textarea{padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--ib);color:var(--tx);font:inherit;width:100%;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--ac2);border-color:transparent}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
h3{margin:0 0 8px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum>div{background:var(--ib);border-radius:14px;padding:10px 4px}
.sum b{display:block;font-size:15px;margin-top:2px}.sum small{color:var(--mu);font-size:12px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;box-shadow:var(--sh);z-index:20}
</style></head><body><div id="app"></div>
<script>
const KEY='warkop_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const dstr=d=>d.toLocaleDateString('sv-SE');
const td=()=>dstr(new Date());
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
let S=null,cart={},tab='jual',rd=td(),delId=null,msg='';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.items)){S={items:[
{id:'i1',name:'Indomie Goreng',p:5000,c:3200,s:40,m:10},
{id:'i2',name:'Indomie Telur',p:7000,c:4700,s:40,m:10},
{id:'i3',name:'Kopi Hitam',p:3000,c:1000,s:50,m:10},
{id:'i4',name:'Es Teh',p:3000,c:800,s:50,m:10}],sales:[]}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const it=id=>S.items.find(x=>x.id===id);
function flash(m){msg=m;R();setTimeout(()=>{msg='';R()},1400)}
function add(id){cart[id]=(cart[id]||0)+1;R()}
function sub(id){if(cart[id]>1)cart[id]--;else delete cart[id];R()}
function clr(){cart={};R()}
function done(){const ids=Object.keys(cart);if(!ids.length)return;
 const l=ids.map(id=>{const x=it(id);x.s-=cart[id];return{id,n:x.name,q:cart[id],p:x.p,c:x.c}});
 S.sales.push({id:Date.now(),d:td(),l});cart={};save();flash('Tersimpan ✓')}
const tg=x=>x.t>0?x.t:x.m*2;
const need=x=>Math.max(tg(x)-x.s,1);
function copyList(){const low=S.items.filter(x=>x.s<=x.m);
 const t='Daftar belanja '+td()+'\n'+low.map(x=>'- '+x.name+': '+need(x)).join('\n');
 try{navigator.clipboard.writeText(t).then(()=>flash('Disalin ✓')).catch(()=>flash('Gagal menyalin'))}catch(e){flash('Gagal menyalin')}}
function adj(id,sg){const v=num($('#q_'+id).value);if(!v)return;it(id).s+=sg*v;save();R()}
function addItem(){const n=$('#nn').value.trim();if(!n)return;
 S.items.push({id:'i'+Date.now(),name:n,p:num($('#np').value),c:num($('#nc').value),s:num($('#ns').value),m:num($('#nm').value),t:num($('#nt').value)});save();R()}
function setF(id,f,v){const x=it(id);x[f]=f==='name'?v:num(v);save()}
function del(id){if(delId===id){S.items=S.items.filter(x=>x.id!==id);delId=null;save()}else delId=id;R()}
function undo(sid){const s=S.sales.find(x=>x.id===sid);if(!s)return;
 s.l.forEach(l=>{const x=it(l.id);if(x)x.s+=l.q});S.sales=S.sales.filter(x=>x.id!==sid);save();R()}
function exp(){$('#bk').value=JSON.stringify(S)}
function imp(){try{const d=JSON.parse($('#bk').value);
 if(d&&Array.isArray(d.items)&&Array.isArray(d.sales)){S=d;save();flash('Data dipulihkan ✓')}else flash('Format salah')}catch(e){flash('Format salah')}}
function setTab(t){tab=t;R()}
let per=7;
function setPer(v){per=v;R()}
function setDate(v){if(v){rd=v;R()}}
const totals=list=>{let o=0,m=0;list.forEach(s=>s.l.forEach(l=>{o+=l.q*l.p;m+=l.q*l.c}));return{o,m,u:o-m}};

function vJual(){
 const g=S.items.map(x=>`<button class="it" onclick="add('${x.id}')"><b>${esc(x.name)}</b><span>${rp(x.p)}</span><small class="${x.s<=x.m?'bad':''}">Stok ${x.s}</small>${cart[x.id]?`<i class="bd">${cart[x.id]}</i>`:''}</button>`).join('');
 const ids=Object.keys(cart);let tot=0;
 const ln=ids.map(id=>{const x=it(id);tot+=x.p*cart[id];return `<div class="row"><span>${esc(x.name)} × ${cart[id]}</span><span>${rp(x.p*cart[id])} <button class="sm" onclick="sub('${id}')">−</button></span></div>`}).join('');
 return `<div class="grid">${g||'<p class="mu">Belum ada barang. Tambah dulu di tab Barang.</p>'}</div>
 <div class="card"><h3>Pesanan sekarang</h3>${ln||'<p class="mu">Ketuk menu di atas untuk menambah.</p>'}
 ${ids.length?`<div class="row"><b>Total</b><b>${rp(tot)}</b></div><button class="big" onclick="done()">Simpan Penjualan</button><button class="sm" style="width:100%;margin-top:8px" onclick="clr()">Kosongkan</button>`:''}</div>`}

function vStok(){
 const low=S.items.filter(x=>x.s<=x.m);let est=0;
 const belanja=`<div class="card"><h3>Daftar Belanja</h3>${low.length?low.map(x=>{est+=need(x)*x.c;return `<div class="row"><span>${esc(x.name)}<br><small class="mu">stok ${x.s}, target ${tg(x)}</small></span><b>beli ${need(x)}</b></div>`}).join('')+`<div class="row"><span>Perkiraan modal belanja</span><b>${rp(est)}</b></div><button class="big" onclick="copyList()">Salin Daftar</button>`:'<p class="mu">Semua stok masih aman 👍</p>'}</div>`;
 return belanja+`<p class="mu">Isi jumlah lalu ketuk Tambah (belanja/kulakan) atau Kurang (koreksi, rusak, dll).</p>`+S.items.map(x=>`<div class="card"><div class="row" style="border:0"><b>${esc(x.name)}</b><b class="${x.s<=x.m?'bad':''}">${x.s}${x.s<=x.m?' ⚠ menipis':''}</b></div>
 <div style="display:flex;gap:6px"><input id="q_${x.id}" type="number" inputmode="decimal" placeholder="jumlah"><button class="sm" onclick="adj('${x.id}',1)">+ Tambah</button><button class="sm" onclick="adj('${x.id}',-1)">− Kurang</button></div></div>`).join('')}

function vBarang(){
 return `<div class="card"><h3>Tambah barang</h3><div class="f">
 <div style="grid-column:1/3"><label>Nama</label><input id="nn"></div>
 <div><label>Harga jual</label><input id="np" type="number" inputmode="numeric"></div>
 <div><label>Harga modal</label><input id="nc" type="number" inputmode="numeric"></div>
 <div><label>Stok awal</label><input id="ns" type="number" inputmode="numeric"></div>
 <div><label>Batas stok menipis</label><input id="nm" type="number" inputmode="numeric"></div>
 <div style="grid-column:1/3"><label>Target stok (ideal setelah belanja)</label><input id="nt" type="number" inputmode="numeric"></div></div>
 <button class="big" onclick="addItem()">Tambah</button></div>`+
 S.items.map(x=>`<div class="card"><div class="f">
 <div style="grid-column:1/3"><label>Nama</label><input value="${esc(x.name)}" onchange="setF('${x.id}','name',this.value)"></div>
 <div><label>Harga jual</label><input type="number" inputmode="numeric" value="${x.p}" onchange="setF('${x.id}','p',this.value)"></div>
 <div><label>Harga modal</label><input type="number" inputmode="numeric" value="${x.c}" onchange="setF('${x.id}','c',this.value)"></div>
 <div><label>Batas menipis</label><input type="number" inputmode="numeric" value="${x.m}" onchange="setF('${x.id}','m',this.value)"></div>
 <div><label>Target stok</label><input type="number" inputmode="numeric" value="${x.t||''}" placeholder="${x.m*2}" onchange="setF('${x.id}','t',this.value)"></div>
 <div style="align-self:end"><button class="sm ${delId===x.id?'bad':''}" style="width:100%" onclick="del('${x.id}')">${delId===x.id?'Yakin hapus?':'Hapus'}</button></div></div></div>`).join('')}

function vLap(){
 const day=S.sales.filter(s=>s.d===rd),t=totals(day),agg={};
 day.forEach(s=>s.l.forEach(l=>{agg[l.n]=(agg[l.n]||0)+l.q}));
 const cut=per===0?'':dstr(new Date(Date.now()-(per-1)*864e5));
 const ag={};S.sales.filter(s=>per===0||s.d>=cut).forEach(s=>s.l.forEach(l=>{const a=ag[l.n]||(ag[l.n]={q:0,u:0});a.q+=l.q;a.u+=l.q*(l.p-l.c)}));
 const rk=Object.entries(ag).sort((a,b)=>b[1].q-a[1].q),mx=rk.length?rk[0][1].q:1,top=rk.slice().sort((a,b)=>b[1].u-a[1].u)[0];
 const terlaris=`<div class="card"><h3>Terlaris</h3><div style="display:flex;gap:6px;margin-bottom:8px">${[[1,'Hari ini'],[7,'7 hari'],[30,'30 hari'],[0,'Semua']].map(([v,n])=>`<button class="sm" style="flex:1;${per===v?'background:var(--ac);color:#fff':''}" onclick="setPer(${v})">${n}</button>`).join('')}</div>
 ${rk.map(([n,a],i)=>`<div style="margin:8px 0"><div class="row" style="border:0;padding:0"><span>${i+1}. ${esc(n)}</span><b>${a.q} terjual</b></div><div style="height:6px;border-radius:4px;background:var(--ln);margin:4px 0"><div style="height:6px;border-radius:4px;background:var(--ac);width:${a.q/mx*100}%"></div></div><small class="mu">Untung ${rp(a.u)}</small></div>`).join('')||'<p class="mu">Belum ada penjualan di periode ini.</p>'}
 ${top?`<p class="mu">Paling banyak untung: <b>${esc(top[0])}</b> (${rp(top[1].u)})</p>`:''}</div>`;
 const days=[...Array(7)].map((_,i)=>dstr(new Date(Date.now()-i*864e5)));
 return `<input type="date" value="${rd}" onchange="setDate(this.value)">
 <div class="card"><div class="sum"><div><small>Pemasukan</small><b>${rp(t.o)}</b></div><div><small>Modal</small><b>${rp(t.m)}</b></div><div><small>Untung</small><b class="ok">${rp(t.u)}</b></div></div></div>
 ${terlaris}
 <div class="card"><h3>Barang terjual</h3>${Object.keys(agg).map(n=>`<div class="row"><span>${esc(n)}</span><b>${agg[n]}</b></div>`).join('')||'<p class="mu">Belum ada penjualan.</p>'}</div>
 <div class="card"><h3>Transaksi</h3>${day.slice().reverse().map(s=>`<div class="row"><span class="mu">${s.l.map(l=>esc(l.n)+' ×'+l.q).join(', ')}</span><button class="sm" onclick="undo(${s.id})">Batalkan</button></div>`).join('')||'<p class="mu">-</p>'}</div>
 <div class="card"><h3>7 hari terakhir</h3>${days.map(d=>{const x=totals(S.sales.filter(s=>s.d===d));return `<div class="row"><span>${d}</span><span>${rp(x.o)} · <span class="ok">${rp(x.u)}</span></span></div>`}).join('')}</div>
 <div class="card"><h3>Backup data</h3><p class="mu">Data tersimpan di browser HP ini. Ekspor lalu salin teksnya ke tempat aman (mis. chat ke diri sendiri).</p>
 <textarea id="bk" rows="3"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="sm" onclick="exp()">Ekspor</button><button class="sm" onclick="imp()">Pulihkan</button></div></div>`}

function R(){
 const tabs=[['jual','🛒','Jual'],['stok','📦','Stok'],['barang','🏷️','Barang'],['lap','📊','Laporan']];
 const v={jual:vJual,stok:vStok,barang:vBarang,lap:vLap}[tab]();
 const hr=totals(S.sales.filter(s=>s.d===td()));
 const tgl=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
 $('#app').innerHTML=`<div class="hd"><div><h1>☕ Kasir Warkop</h1><small>${tgl}</small></div><div class="t"><small>Pemasukan hari ini</small><b>${rp(hr.o)}</b></div></div>${v}<nav>${tabs.map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')"><span>${i}</span>${n}</button>`).join('')}</nav>${msg?`<div id="toast">${msg}</div>`:''}`}
R();
</script></body></html>
