<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tb{display:flex;gap:8px;margin-bottom:10px}.sr{flex:1}.so{width:auto;max-width:132px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.sc{margin:8px 0;padding:12px}.stk{font-size:22px}
details.card summary{font-weight:700;cursor:pointer}
.fb{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tx);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:8}

.seg{display:flex;gap:4px;background:var(--ib);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border:0;border-radius:11px;background:none;color:var(--mu);font:inherit;font-size:14px}
.seg button.on{background:var(--cd);color:var(--ac);font-weight:700;box-shadow:var(--sh)}
.help{background:var(--ib);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mu);margin-bottom:12px;line-height:1.5}.help b{color:var(--tx)}
.it.menu{border:2px solid var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--cd);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.stp{margin:14px 0 8px;font-weight:700}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.op{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border:2px solid var(--ln);background:var(--ib);color:var(--tx);border-radius:14px;font:inherit;text-align:left}
.op.on{border-color:var(--ac);background:var(--cd)}.op.on span::before{content:"✓ ";color:var(--ac)}.op small{color:var(--mu)}
.shb{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;position:sticky;bottom:0;background:var(--cd);padding-top:8px}
.shb .big{width:auto;flex:1;margin:0}
.nr{display:grid;grid-template-columns:1fr 78px 98px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.nr input{padding:9px 8px}
.pe{display:flex;gap:6px;margin-top:6px}.pe button{flex:1;padding:10px 4px;border:1px solid var(--ln);border-radius:12px;background:var(--ib);color:var(--tx);font:inherit;font-size:14px;font-weight:700}.pe button:active{background:var(--ac);color:var(--on)}
</style></head><body><div id="app"></div>
<script>
const KEY='warkop_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const dstr=d=>d.toLocaleDateString('sv-SE');
const td=()=>dstr(new Date());
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
let S=null,cart={},tab='jual',rd=td(),delId=null,msg='',per=7,q='',cat='',sort='az',editId=null,addOpen=false,catOpen=false,bsub='brg',sh=null,edM=null,edA=null,mAdd=false,aAdd=false,nota=false,nq='',nt={};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.items)){S={items:[],sales:[]}}
function norm(){if(!Array.isArray(S.sales))S.sales=[];if(!Array.isArray(S.menus))S.menus=[];if(!Array.isArray(S.addons))S.addons=[];if(!Array.isArray(S.cats))S.cats=['Makanan','Minuman','Snack','Lainnya'];
 S.items.forEach(x=>{if(!x.cat)x.cat='Lainnya';if(!S.cats.includes(x.cat))S.cats.push(x.cat)})}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const it=id=>S.items.find(x=>x.id===id);
function addStock(x,q,h){const t=x.s+q;x.c=(x.s>0&&t>0)?Math.round((x.s*x.c+q*h)/t*100)/100:h;x.s=t}
function take(id,k){const x=it(id);x.s-=k;return{cost:k*x.c}}
const base=x=>(x.ref&&it(x.ref))||x;
const mnu=id=>S.menus.find(m=>m.id===id),adn=id=>S.addons.find(a=>a.id===id);
const use=x=>x.ref&&it(x.ref)?(x.u>0?x.u:1):1;
function flash(m){msg=m;R();setTimeout(()=>{msg='';R()},1400)}
function lineInfo(l){
 if(l.t==='m'){const mn=mnu(l.id),f=it(l.f);if(!mn||!f)return null;
  const ads=(l.a||[]).map(adn).filter(Boolean);let p=mn.p,mc=0;const uses=[{id:f.id,k:1}];
  ads.forEach(a=>{p+=a.p;if(a.ref==='@same')uses.push({id:f.id,k:a.k});else if(a.ref&&it(a.ref))uses.push({id:a.ref,k:a.k});else mc+=a.c});
  return{n:f.name+(ads.length?' + '+ads.map(a=>a.name).join(' + '):''),p,mc,uses,g:f.name,mid:mn.id,ad:ads.map(a=>a.name)}}
 const x=it(l.id);if(!x)return null;
 const ice=l.v==='e'&&x.pe>0,nm=x.name+(x.pe>0?(ice?' (Es)':' (Panas)'):''),p=ice?x.pe:x.p;
 return x.ref&&it(x.ref)?{n:nm,p,mc:x.c,uses:[{id:x.ref,k:use(x),nc:true}],g:x.name}:{n:nm,p,mc:0,uses:[{id:x.id,k:1}],g:x.name}}
const cl=()=>Object.keys(cart).map(k=>({k,q:cart[k].q,i:lineInfo(cart[k])})).filter(z=>z.i);
function cinfo(){let n=0,t=0;cl().forEach(z=>{n+=z.q;t+=z.i.p*z.q});return{n,t}}
function add(id,v){const k=v==='e'?id+'|e':id;cart[k]=cart[k]||{q:0,t:'i',id,v:v==='e'?'e':''};cart[k].q++;R()}
function sub(k){if(cart[k].q>1)cart[k].q--;else delete cart[k];R()}
function clr(){cart={};R()}
function done(){const L=cl();if(!L.length)return;
 const rec=L.map(z=>{const i=z.i,l=cart[z.k];let cost=i.mc*z.q;
  const us=i.uses.map(u=>{const k=u.k*z.q,r=take(u.id,k);if(!u.nc)cost+=r.cost;return{id:u.id,k}});
  return{id:l.id,n:i.n,q:z.q,p:i.p,c:cost/z.q,g:i.g,mid:i.mid,ad:i.ad,uses:us}});
 S.sales.push({id:Date.now(),d:td(),l:rec});cart={};save();flash('Tersimpan ✓')}
function openM(id){sh={mid:id,f:'',a:[]};R()}
function shX(){sh=null;R()}
function shF(id){sh.f=id;R()}
function shA(id){const i=sh.a.indexOf(id);if(i<0)sh.a.push(id);else sh.a.splice(i,1);R()}
function shAdd(){if(!sh.f){flash('Pilih rasa dulu ya');return}
 const a=sh.a.slice().sort(),key='m|'+sh.mid+'|'+sh.f+'|'+a.join(',');
 if(cart[key])cart[key].q++;else cart[key]={q:1,t:'m',id:sh.mid,f:sh.f,a};
 sh=null;R()}
function sheet(){if(!sh)return'';const mn=mnu(sh.mid);if(!mn)return'';
 const fs=mn.fl.map(it).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'id')),ads=mn.ad.map(adn).filter(Boolean);
 let tot=mn.p;ads.forEach(a=>{if(sh.a.includes(a.id))tot+=a.p});
 return `<div class="ov" onclick="shX()"><div class="sh" onclick="event.stopPropagation()"><h3 style="font-size:19px">${esc(mn.name)}</h3>
 <div class="stp"><b>1</b>Pilih rasa</div>${fs.length?`<div class="opts">${fs.map(f=>`<button class="op ${sh.f===f.id?'on':''}" onclick="shF('${f.id}')"><span>${esc(f.name)}</span><small class="${f.s<=f.m?'bad':''}">stok ${f.s}</small></button>`).join('')}</div>`:'<p class="mu">Belum ada rasa. Atur di Barang → Menu pilihan.</p>'}
 ${ads.length?`<div class="stp"><b>2</b>Tambahan <small class="mu">(boleh lebih dari satu, boleh kosong)</small></div><div class="opts">${ads.map(a=>`<button class="op ${sh.a.includes(a.id)?'on':''}" onclick="shA('${a.id}')"><span>${esc(a.name)}</span><small>+${rp(a.p)}</small></button>`).join('')}</div>`:''}
 <div class="shb"><div><small class="mu">Total</small><br><b style="font-size:20px">${rp(tot)}</b></div><button class="big" onclick="shAdd()">Tambah ke pesanan</button></div></div></div>`}
function adj(id,sg){const v=num($('#q_'+id).value);if(!v)return;const x=it(id);
 if(sg>0)addStock(x,v,num($('#h_'+id).value)||x.c);else x.s-=v;save();R()}
function addItem(){const n=$('#nn').value.trim();if(!n)return;
 S.items.push({id:'i'+Date.now(),name:n,cat:$('#ncat').value||'Lainnya',p:num($('#np').value),pe:num($('#npe').value),c:num($('#nc').value),s:num($('#ns').value),m:num($('#nm').value),ref:$('#nr').value,u:num($('#nu').value)||1,nj:$('#nj').value==='1'});
 addOpen=false;save();R()}
function setF(id,f,v){const x=it(id);x[f]=(f==='name'||f==='cat'||f==='ref')?v:f==='nj'?v==='1':num(v);
 if(f==='ref'&&v&&!(x.u>0))x.u=1;save();if(f==='cat'||f==='ref'||f==='nj')R()}
function del(id){if(delId===id){S.items=S.items.filter(x=>x.id!==id);S.items.forEach(y=>{if(y.ref===id)y.ref=''});S.menus.forEach(m=>{m.fl=m.fl.filter(i=>i!==id)});S.addons.forEach(a=>{if(a.ref===id)a.ref=''});delId=null;editId=null;save()}else delId=id;R()}
function tog(id){editId=editId===id?null:id;delId=null;R()}
function addCat(){const n=$('#ncn').value.trim();if(!n||S.cats.includes(n))return;S.cats.push(n);save();R()}
function delCat(i){const c=S.cats[i];if(S.items.some(x=>x.cat===c)){flash('Masih dipakai barang');return}S.cats.splice(i,1);if(cat===c)cat='';save();R()}
function togM(id){edM=edM===id?null:id;delId=null;R()}
function togFl(m,i){const a=mnu(m).fl,k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);save();R()}
function togAd(m,i){const a=mnu(m).ad,k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);save();R()}
function setM(id,f,v){mnu(id)[f]=f==='p'?num(v):v;save()}
function addM(){const n=$('#mn').value.trim();if(!n)return;const id='m'+Date.now();S.menus.push({id,name:n,cat:$('#mc').value||'Lainnya',p:num($('#mp').value),fl:[],ad:[]});edM=id;mAdd=false;save();R()}
function delM(id){if(delId===id){S.menus=S.menus.filter(m=>m.id!==id);delId=null;edM=null;save()}else delId=id;R()}
function togA(id){edA=edA===id?null:id;delId=null;R()}
function setA(id,f,v){const a=adn(id);a[f]=f==='name'||f==='ref'?v:num(v);if(f==='ref'&&v&&!(a.k>0))a.k=1;save();if(f==='ref')R()}
function addA(){const n=$('#an').value.trim();if(!n)return;const id='a'+Date.now();S.addons.push({id,name:n,p:num($('#ap').value),ref:'',k:1,c:0});edA=id;aAdd=false;save();R()}
function delA(id){if(delId===id){S.addons=S.addons.filter(a=>a.id!==id);S.menus.forEach(m=>{m.ad=m.ad.filter(i=>i!==id)});delId=null;edA=null;save()}else delId=id;R()}
function openN(){nota=true;nq='';R()}
function closeN(){nota=false;R()}
function setN(id,f,v){nt[id]=nt[id]||{};nt[id][f]=num(v);ntot()}
function ntotal(){let t=0;Object.keys(nt).forEach(id=>{const x=it(id),r=nt[id];if(x&&r.q>0)t+=r.q*(r.h>0?r.h:x.c)});return t}
function ntot(){const e=$('#ntot');if(e)e.textContent=rp(ntotal())}
function paintN(){const e=$('#nlist');if(e)e.innerHTML=nlist()}
function nlist(){const k=nq.trim().toLowerCase();
 return S.items.filter(x=>!x.ref&&(!k||x.name.toLowerCase().includes(k))).sort((a,b)=>a.name.localeCompare(b.name,'id')).map(x=>{const r=nt[x.id]||{};
 return `<div class="nr"><div><b>${esc(x.name)}</b><br><small class="mu">stok ${x.s} · modal ${rp(x.c)}</small></div><input type="number" inputmode="decimal" placeholder="jumlah" value="${r.q||''}" oninput="setN('${x.id}','q',this.value)"><input type="number" inputmode="numeric" placeholder="harga beli" value="${r.h||''}" oninput="setN('${x.id}','h',this.value)"></div>`}).join('')||'<p class="mu">Tidak ada barang.</p>'}
function saveN(){let n=0;Object.keys(nt).forEach(id=>{const x=it(id),r=nt[id];if(x&&r.q>0){addStock(x,r.q,r.h>0?r.h:x.c);n++}});
 if(!n){flash('Belum ada jumlah yang diisi');return}nt={};nota=false;save();flash(n+' barang ditambah ✓')}
function notaSheet(){if(!nota)return'';
 return `<div class="ov" onclick="closeN()"><div class="sh" onclick="event.stopPropagation()"><h3 style="font-size:19px">📝 Catat kulakan</h3><p class="mu" style="margin:4px 0 10px">Isi jumlah dan harga beli per satuan untuk barang yang dibeli. Kosongkan harga kalau sama dengan modal sekarang.</p>
 <div class="tb"><input class="sr" type="search" placeholder="🔍 Cari barang…" value="${esc(nq)}" oninput="nq=this.value;paintN()"></div>
 <div id="nlist">${nlist()}</div>
 <div class="shb"><div><small class="mu">Total belanja</small><br><b style="font-size:20px" id="ntot">${rp(ntotal())}</b></div><button class="big" onclick="saveN()">Simpan kulakan</button></div></div></div>`}
function undo(sid){const s=S.sales.find(x=>x.id===sid);if(!s)return;
 s.l.forEach(l=>{if(l.uses)l.uses.forEach(u=>{const x=it(u.id);if(x)x.s+=u.k});else{const x=it(l.b||l.id);if(x)x.s+=(l.k!=null?l.k:l.q)}});
 S.sales=S.sales.filter(x=>x.id!==sid);save();R()}
function tt(m){const d=document.createElement('div');d.id='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
let bkv='',impAsk=false;
function exp(){bkv=JSON.stringify(S);R()}
function salin(){const e=$('#bk'),t=e?e.value:'';if(!t){tt('Kotak masih kosong. Ketuk Munculkan data dulu');return}
 const fb=()=>{e.focus();e.select();try{e.setSelectionRange(0,t.length)}catch(x){}let ok=false;try{ok=document.execCommand('copy')}catch(x){}tt(ok?'Disalin ✓':'Tekan lama di kotak, lalu Salin')};
 try{navigator.clipboard.writeText(t).then(()=>tt('Disalin ✓')).catch(fb)}catch(x){fb()}}
function imp(){const raw=bkv.trim();if(!raw){tt('Kotak masih kosong');return}
 let d;try{d=JSON.parse(raw)}catch(e){tt('Format backup salah');return}
 if(!(d&&Array.isArray(d.items)&&Array.isArray(d.sales))){tt('Format backup salah');return}
 if(!impAsk){impAsk=true;R();setTimeout(()=>{if(impAsk){impAsk=false;R()}},5000);return}
 impAsk=false;bkv='';S=d;norm();save();flash('Data dipulihkan ✓')}
function setTab(t){tab=t;q='';cat='';editId=null;R()}
function setDate(v){if(v){rd=v;R()}}
function setPer(v){per=v;R()}
function setCat(i){cat=i<0?'':S.cats[i];R()}
function setQ(v){q=v;paint()}
function copyList(){const low=S.items.filter(x=>!x.ref&&x.s<=x.m);
 const t='Daftar belanja '+td()+'\n'+low.map(x=>'- '+x.name+' (stok '+x.s+')').join('\n');
